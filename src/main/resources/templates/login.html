<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head  th:replace="fragments/head :: headerFragment">
</head>
<body>
	<div th:replace="fragments/header :: header">...</div>

	<div class="page-narrow">
		<h1 th:text="#{label.signin.title}" class="page-title">Sign In</h1>
		<p class="page-sub" th:text="#{label.signin.sub}">Welcome back.</p>

		<form name='f' action='/user/login' method='POST'>
			<div class="field">
				<input th:placeholder="#{label.signin.email}" name="username" class="form-control" required="true" autofocus="true" />
			</div>
			<div class="field">
				<input th:placeholder="#{label.signin.password}" type="password" name="password" class="form-control" required="true" />
			</div>

			<p th:if="${loginError}" th:text="#{label.signin.errorrmessage}" class="error">Wrong user or password</p>

			<div class="checkbox">
				<label>
					<input type="checkbox" name="remember-me" /> <span th:text="#{label.signin.rememberme}">Remember me</span>
				</label>
			</div>

			<button th:text="#{label.signin.submit}" class="btn btn-lg btn-primary btn-block" type="submit">Sign in</button>
		</form>

		<p class="form-footer">
			<a href="/user/forgotPassword" th:text="#{label.signin.forgotpassword}">Forgot my Password</a>
			&#160;&#183;&#160;
			<a href="/user/registration">Create an account</a>
		</p>
	</div>

	<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
