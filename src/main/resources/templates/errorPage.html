<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head  th:replace="fragments/head :: headerFragment">
</head>
<body>
	<div th:replace="fragments/header :: header">...</div>

	<div class="page">
		<div class="message">
			<h1 th:text="|Error ${errorInfo.code}|">Error</h1>
			<h3 th:text="|Couldn't access ${errorInfo.url}|">Error</h3>
			<h3 th:if="${errorInfo.message} != null" th:text="|Reason: ${errorInfo.message}|">Reason</h3>
			<a href="/" class="btn btn-lg btn-primary">Back to quizzes</a>
		</div>
	</div>
</body>
</html>
