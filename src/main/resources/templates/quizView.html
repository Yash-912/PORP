<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head  th:replace="fragments/head :: headerFragment">
</head>
<body>
	<div th:replace="fragments/header :: header">...</div>

	<div class="page">
		<div class="quiz-detail">

			<a th:href="|/quiz/${quiz.id}/play|" th:text="#{label.selectedquiz.playbutton}" class="btn btn-lg btn-primary">Play</a>
		</div>
	</div>
</body>
</html>
