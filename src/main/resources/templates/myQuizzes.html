<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head  th:replace="fragments/head :: headerFragment">
</head>
<body ng-app="myQuizzesApp" th:attr="ng-init='userId='+${#authentication.principal.id}">
	<div th:replace="fragments/header :: header">...</div>

	<div class="page" ng-controller="MyQuizzesCtrl">

		<div class="hero">
			<h1 th:text="#{label.myquizzes.hero}">Your quizzes.</h1>
			<p th:text="#{label.myquizzes.sub}">Edit, publish and manage everything you have made.</p>
			<a href="/createQuiz" class="btn btn-lg btn-primary" th:text="#{label.home.create}">Create a quiz</a>
		</div>

		<div class="quiz-grid">
			<div class="quiz-card" ng-repeat="quiz in quizzes">
				<span class="status" ng-class="{live: quiz.isPublished}">{{quiz.isPublished ? 'Published' : 'Draft'}}</span>
				<h3>{{quiz.name}}</h3>
				<p>{{quiz.description}}</p>
				<div class="card-foot">
					<a href="/editQuiz/{{quiz.id}}" class="btn btn-primary" th:text="#{label.myquizzes.maintable.headers.edit}">Edit</a>
					<button class="btn btn-link-danger" ng-click="deleteQuiz(quiz.id)">Delete</button>
				</div>
			</div>
		</div>

		<p class="empty" ng-if="quizzes !== undefined &amp;&amp; quizzes.length === 0" th:text="#{label.myquizzes.empty}">You have not created a quiz yet.</p>

		<div class="load-more">
			<button th:text="#{label.myquizzes.maintable.loadmore}" class="btn btn-default" ng-click="loadNextPage()" ng-show="pagination.morePagesAvailable">Load more...</button>
		</div>
	</div>

	<div th:replace="fragments/angular :: angular">...</div>
	<script type="text/javascript" src="../js/myQuizzesApp.js"
		        th:src="@{/js/myQuizzesApp.js}"></script>
</body>
</html>
