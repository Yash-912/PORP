<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head  th:replace="fragments/head :: headerFragment">
</head>
<body ng-app="editAnswersApp" th:attr="ng-init='questionId='+${question.id}">
	<div th:replace="fragments/header :: header">...</div>

	<div class="page-medium" ng-controller="EditAnswersCtrl">
		<h1 th:text="${question.text}" class="page-title">Question text</h1>
		<p class="page-sub" th:text="#{label.editanswers.sub}">Add the possible answers and select the correct one.</p>

		<form name="EditAnswers">
			<ul dnd-list="answers" class="edit-list">
				<li ng-repeat="answer in answers"
				    dnd-draggable="answer"
				    dnd-moved="answers.splice($index, 1)"
				    dnd-effect-allowed="move">
					<div class="edit-row">
						<div class="input-group">
							<span class="input-group-addon" id="draggable-addon">&#8942;&#8942;</span>
							<span class="input-group-addon">
								<input type="radio" ng-model="$parent.correctAnswer" ng-value="{{answer.id}}" name="isCorrect" title="Correct answer" />
							</span>
							<input th:placeholder="#{label.editanswers.text.placeholder}" class="form-control" aria-describedby="draggable-addon" ng-model="answer.text" />
						</div>
						<div class="actions actions-2">
							<button class="btn btn-icon" ng-click="saveAnswer(answer.id, answer.text)" title="Save">
								<span class="glyphicon glyphicon-ok" aria-hidden="true"></span>
							</button>
							<button class="btn btn-icon danger" ng-click="deleteAnswer(answer.id)" title="Delete">
								<span class="glyphicon glyphicon-trash" aria-hidden="true"></span>
							</button>
						</div>
					</div>
				</li>
				<li class="dndPlaceholder">
					<p>Drop here...</p>
				</li>
			</ul>

			<ul class="edit-list">
				<li>
					<div class="edit-row">
						<div class="input-group">
							<span class="input-group-addon" id="not-draggable-addon">+</span>
							<input th:placeholder="#{label.editanswers.text.placeholder}" class="form-control" aria-describedby="not-draggable-addon" ng-model="newAnswer" />
						</div>
						<div class="actions actions-2">
							<button class="btn btn-icon" ng-click="saveAnswer(0, newAnswer)" title="Add answer">
								<span class="glyphicon glyphicon-plus" aria-hidden="true"></span>
							</button>
						</div>
					</div>
				</li>
			</ul>

			<div class="save-bar">
				<button th:text="#{label.editquiz.submit.saveAll}" class="btn btn-lg btn-primary" type="submit" ng-click="saveAll(correctAnswer)">Update</button>
			</div>
		</form>
	</div>

	<div th:replace="fragments/angular :: angular">...</div>
	<script type="text/javascript" src="../js/angular-drag-and-drop-lists.min.js"
		        th:src="@{/js/angular-drag-and-drop-lists.min.js}"></script>
	<script type="text/javascript" src="../js/editAnswersApp.js"
		        th:src="@{/js/editAnswersApp.js}"></script>
</body>
</html>
