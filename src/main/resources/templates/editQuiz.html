<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head  th:replace="fragments/head :: headerFragment">
</head>
<body ng-app="editApp" th:attr="ng-init='quizId='+${quiz.id}">
	<div th:replace="fragments/header :: header">...</div>

	<div class="page-medium" ng-controller="EditCtrl">
		<a href="/user/quizzes" class="back-link">My quizzes</a>
		<h1 th:text="#{label.editquiz.pagetitle}" class="page-title">Edit Quiz</h1>
		<p class="page-sub" th:text="#{label.editquiz.sub}">Add questions, then publish when it is ready.</p>

		<form name="EditQuiz">
			<div class="field">
				<label th:text="#{label.newquiz.title}">Title</label>
				<input th:placeholder="#{label.newquiz.title.placeholder}" name="name" class="form-control" required="true" autofocus="true" ng-model="quiz.name" />
			</div>
			<div class="field">
				<label th:text="#{label.newquiz.description}">Description</label>
				<textarea th:placeholder="#{label.newquiz.description.placeholder}" name="description" class="form-control" rows="3" ng-model="quiz.description"></textarea>
			</div>

			<h2 th:text="#{label.editquiz.questionstitle}" class="section-title">Questions</h2>

			<ul dnd-list="questions" class="edit-list">
				<li ng-repeat="question in questions"
				    dnd-draggable="question"
				    dnd-moved="questions.splice($index, 1)"
				    dnd-effect-allowed="move">
					<div class="edit-row">
						<div class="input-group">
							<span class="input-group-addon" id="draggable-addon">&#8942;&#8942;</span>
							<input th:placeholder="#{label.editquiz.text.placeholder}" class="form-control" aria-describedby="draggable-addon" ng-model="question.text" />
						</div>
						<div class="actions actions-3">
							<button class="btn btn-icon" ng-click="saveQuestion(question.id, question.text)" title="Save">
								<span class="glyphicon glyphicon-ok" aria-hidden="true"></span>
							</button>
							<a href="/editAnswer/{{question.id}}" class="btn btn-sm btn-default" title="Edit answers">Answers</a>
							<button class="btn btn-icon danger" ng-click="deleteQuestion(question.id)" title="Delete">
								<span class="glyphicon glyphicon-trash" aria-hidden="true"></span>
							</button>
						</div>
					</div>
				</li>
				<li class="dndPlaceholder">
					<p>Drop here...</p>
				</li>
			</ul>

			<ul class="edit-list">
				<li>
					<div class="edit-row">
						<div class="input-group">
							<span class="input-group-addon" id="not-draggable-addon">+</span>
							<input th:placeholder="#{label.editquiz.text.placeholder}" class="form-control" aria-describedby="not-draggable-addon" ng-model="newQuestion" />
						</div>
						<div class="actions actions-3">
							<button class="btn btn-icon" ng-click="saveQuestion(0, newQuestion)" title="Add question">
								<span class="glyphicon glyphicon-plus" aria-hidden="true"></span>
							</button>
						</div>
					</div>
				</li>
			</ul>

			<div class="save-bar">
				<button th:text="#{label.editquiz.submit.saveAll}" class="btn btn-lg btn-default" type="submit" ng-click="saveAll()" ng-disabled="isQuizSaving">Update</button>
				<button th:text="#{label.editquiz.submit.publish}" class="btn btn-lg btn-primary" type="submit" ng-hide="quiz.isPublished" ng-click="publish()" ng-disabled="isPublishing">Publish</button>
			</div>
		</form>
	</div>

	<div th:replace="fragments/angular :: angular"></div>
	<script type="text/javascript" src="../js/angular-drag-and-drop-lists.min.js"
		        th:src="@{/js/angular-drag-and-drop-lists.min.js}"></script>
	<script type="text/javascript" src="../js/editApp.js"
		        th:src="@{/js/editApp.js}"></script>

	<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
