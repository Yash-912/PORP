<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head  th:replace="fragments/head :: headerFragment">
</head>
<body ng-app="homeApp">
	<div th:replace="fragments/header :: header">...</div>

	<div class="page" ng-controller="HomeCtrl">

		<div class="hero">
			<h1 th:text="#{label.home.hero}">Test what you know.</h1>
			<p th:text="#{label.home.sub}">Play a quiz in seconds, or create your own.</p>
			<a href="/createQuiz" class="btn btn-lg btn-primary" th:text="#{label.home.create}">Create a quiz</a>
		</div>

		<div class="quiz-grid">
			<div class="quiz-card" ng-repeat="quiz in quizzes">
				<h3>{{quiz.name}}</h3>
				<p>{{quiz.description}}</p>
				<div class="card-foot">
					<a href="/quiz/{{quiz.id}}" class="btn btn-primary" th:text="#{label.home.play}">Play</a>
				</div>
			</div>
		</div>

		<p class="empty" ng-if="quizzes !== undefined &amp;&amp; quizzes.length === 0" th:text="#{label.home.empty}">No quizzes yet.</p>

		<div class="load-more">
			<button th:text="#{label.home.maintable.loadmore}" class="btn btn-default" ng-click="loadNextPage()" ng-show="pagination.morePagesAvailable">Load more...</button>
		</div>

	</div>

	<div th:replace="fragments/angular :: angular">...</div>
	<script type="text/javascript" src="../js/homeApp.js"
		        th:src="@{/js/homeApp.js}"></script>
</body>
</html>
