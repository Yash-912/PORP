<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head  th:replace="fragments/head :: headerFragment">
</head>
<body>
	<div th:replace="fragments/header :: header">...</div>

	<div class="page-narrow">
		<h1 th:text="#{label.forgotpassword.title}" class="page-title">Forgot password</h1>
		<p th:text="#{label.forgotpassword.subtext}" class="page-sub">Help text</p>

		<form name='f' action='/user/forgotPassword' method='POST'>
			<div class="field">
				<input th:placeholder="#{label.forgotpassword.email}" type="email" name="email" class="form-control" required="true" autofocus="true" />
			</div>
			<button th:text="#{label.forgotpassword.submit}" class="btn btn-lg btn-primary btn-block" type="submit">Send</button>
		</form>

		<p class="form-footer"><a href="/user/login">Back to sign in</a></p>
	</div>

	<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
